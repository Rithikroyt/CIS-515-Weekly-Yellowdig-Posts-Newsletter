services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - ../.env
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Phoenix}
      - TZ=${GENERIC_TIMEZONE:-America/Phoenix}
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows

volumes:
  n8n_data:
    external: true
